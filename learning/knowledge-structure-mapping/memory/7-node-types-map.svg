<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title{font:700 40px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#171717}
      .subtitle{font:400 22px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#555}
      .groupTitle{font:700 28px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#171717}
      .label{font:700 24px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#171717}
      .sub{font:400 18px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#333}
      .small{font:400 17px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#444}
      .mono{font:700 22px Consolas, monospace; fill:#171717}
      .line{stroke:#171717; stroke-width:3; fill:none}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f7f7f4"/>
  <text x="80" y="80" class="title">7 类 Node Type（节点类型）记忆图</text>
  <text x="80" y="120" class="subtitle">Memory Scaffold（记忆脚手架）：对象 2 · 描述 2 · 结构 3</text>

  <rect x="550" y="170" rx="28" ry="28" width="300" height="120" fill="#ffffff" stroke="#171717" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="222" text-anchor="middle" class="label">7 类 Node Type（节点类型）</text>
  <text x="700" y="256" text-anchor="middle" class="sub">先记 2–2–3，再展开 7 项</text>

  <rect x="90" y="360" rx="24" ry="24" width="350" height="350" fill="#D9EFFF" stroke="#1f4e79" stroke-width="3" filter="url(#shadow)"/>
  <text x="130" y="415" class="groupTitle">① Object（对象）</text>
  <text x="130" y="452" class="small">问：它是什么东西？</text>
  <rect x="130" y="500" rx="18" ry="18" width="130" height="110" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="195" y="548" text-anchor="middle" class="label">Instance</text>
  <text x="195" y="578" text-anchor="middle" class="small">实例</text>
  <rect x="275" y="500" rx="18" ry="18" width="130" height="110" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="340" y="540" text-anchor="middle" class="label">Class /</text>
  <text x="340" y="572" text-anchor="middle" class="label">Concept</text>
  <text x="340" y="602" text-anchor="middle" class="small">类 / 概念</text>
  <text x="130" y="655" class="small">例：</text>
  <text x="165" y="655" class="small">“林凡” → Instance（实例）</text>
  <text x="130" y="685" class="small">“重生题材” → Class / Concept（类 / 概念）</text>

  <rect x="960" y="360" rx="24" ry="24" width="350" height="350" fill="#FBE3C3" stroke="#9a5b00" stroke-width="3" filter="url(#shadow)"/>
  <text x="1000" y="415" class="groupTitle">② Description（描述）</text>
  <text x="1000" y="452" class="small">问：我们怎样描述它？</text>
  <rect x="1000" y="500" rx="18" ry="18" width="130" height="110" fill="#ffffff" stroke="#9a5b00" stroke-width="2.5"/>
  <text x="1065" y="548" text-anchor="middle" class="label">Dimension</text>
  <text x="1065" y="578" text-anchor="middle" class="small">维度</text>
  <rect x="1145" y="500" rx="18" ry="18" width="130" height="110" fill="#ffffff" stroke="#9a5b00" stroke-width="2.5"/>
  <text x="1210" y="548" text-anchor="middle" class="label">Value</text>
  <text x="1210" y="578" text-anchor="middle" class="small">取值</text>
  <text x="1000" y="655" class="small">Dimension（维度） = 比较 / 描述的轴</text>
  <text x="1000" y="685" class="small">Value（取值） = 这条轴上的状态 / 类别</text>

  <rect x="300" y="600" rx="24" ry="24" width="800" height="220" fill="#DBF1D8" stroke="#2d6a32" stroke-width="3" filter="url(#shadow)"/>
  <text x="340" y="655" class="groupTitle">③ Structure（结构）</text>
  <text x="340" y="692" class="small">问：它怎样在结构里存在 / 运动 / 连接？</text>
  <rect x="360" y="725" rx="18" ry="18" width="180" height="72" fill="#ffffff" stroke="#2d6a32" stroke-width="2.5"/>
  <text x="450" y="770" text-anchor="middle" class="label">Component</text>
  <text x="450" y="792" text-anchor="middle" class="small">组成部分</text>
  <rect x="610" y="725" rx="18" ry="18" width="180" height="72" fill="#ffffff" stroke="#2d6a32" stroke-width="2.5"/>
  <text x="700" y="770" text-anchor="middle" class="label">Process / Stage</text>
  <text x="700" y="792" text-anchor="middle" class="small">过程 / 阶段</text>
  <rect x="860" y="725" rx="18" ry="18" width="180" height="72" fill="#ffffff" stroke="#2d6a32" stroke-width="2.5"/>
  <text x="950" y="770" text-anchor="middle" class="label">Relation</text>
  <text x="950" y="792" text-anchor="middle" class="small">关系</text>

  <path d="M550 232 C470 250, 380 300, 270 360" class="line"/>
  <path d="M850 232 C930 250, 1020 300, 1135 360" class="line"/>
  <path d="M700 290 C700 390, 700 500, 700 600" class="line"/>

  <rect x="75" y="770" rx="18" ry="18" width="170" height="82" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="160" y="812" text-anchor="middle" class="mono">2–2–3</text>
  <text x="160" y="838" text-anchor="middle" class="small">记忆顺序</text>

  <rect x="1140" y="760" rx="18" ry="18" width="180" height="92" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="1230" y="798" text-anchor="middle" class="small">Retrieval（提取）</text>
  <text x="1230" y="826" text-anchor="middle" class="small">对象 → 描述 → 结构</text>
</svg>